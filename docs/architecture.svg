<text x="65" y="621" font-family="Arial,sans-serif" font-size="23" fill="#16324f">Repair flow: OPEN → ASSIGNED → RESOLVED → VERIFIED</text>
<text x="65" y="662" font-family="Arial,sans-serif" font-size="18" fill="#16324f">Rework: RESOLVED → ASSIGNED. Reopen: VERIFIED → OPEN. Actor names are self-reported.</text>
